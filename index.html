<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Esencia AR Demo</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0d0d0d;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      overflow:hidden;
    }

    .container{
      width:100%;
      max-width:430px;
      height:100vh;
      background:linear-gradient(to bottom,#121212,#1d140f);
      position:relative;
      overflow:hidden;
    }

    .top{
      padding:24px;
      text-align:center;
    }

    .title{
      font-size:30px;
      font-weight:bold;
      margin-bottom:8px;
    }

    .subtitle{
      opacity:.7;
      line-height:1.5;
    }

    model-viewer{
      width:100%;
      height:58vh;
      background:transparent;
    }

    .bottom{
      position:absolute;
      bottom:0;
      width:100%;
      padding:24px;
      background:linear-gradient(to top,rgba(0,0,0,.85),transparent);
    }

    .card{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      border-radius:24px;
      padding:18px;
      margin-bottom:20px;
      backdrop-filter:blur(12px);
    }

    .bean{
      font-size:22px;
      margin-bottom:8px;
    }

    .btn{
      width:100%;
      padding:18px;
      border:none;
      border-radius:999px;
      background:#c59a6d;
      color:black;
      font-weight:bold;
      font-size:17px;
      cursor:pointer;
      transition:.2s;
    }

    .btn:hover{
      transform:scale(1.02);
    }

    .tag{
      position:absolute;
      top:20px;
      right:20px;
      background:rgba(255,255,255,.08);
      padding:10px 16px;
      border-radius:999px;
      backdrop-filter:blur(10px);
      font-size:14px;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="tag">Esencia AR</div>

  <div class="top">
    <div class="title">Grano de Café</div>
    <div class="subtitle">
      Visualiza el objeto en 3D y colócalo sobre tu mesa usando realidad aumentada.
    </div>
  </div>

  <model-viewer
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
    ar
    ar-modes="scene-viewer quick-look webxr"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    style="background:transparent;">
  </model-viewer>

  <div class="bottom">
    <div class="card">
      <div class="bean">☕ Grano Arábica</div>
      <div>
        Este es un ejemplo de cómo podríamos mostrar objetos 3D y promociones dentro de la app de fidelización de Esencia.
      </div>
    </div>

    <button class="btn" onclick="document.querySelector('model-viewer').activateAR()">
      Ver sobre mi mesa
    </button>
  </div>

</div>

</body>
</html>
